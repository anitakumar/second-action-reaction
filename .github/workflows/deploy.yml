name: Test Project
# on:
#   push:
#     branches:
#       - main
#   pull_request:
#     branches:
#       - main
on: [push, workflow_dispatch] # add muliplt events, you wil get runworkflow button
jobs:
  # two jobs created and then will run in parallel running separately on the runners
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        #with the add configurations
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'
      - name: Install dependencies
        run: npm ci # safer to use ci instead on install
      - name: Run tests
        run: npm test
      #upload to server
  # this is another job in the workflow needs a runner
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        #with the add configurations
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'
      - name: Install dependencies
        run: npm ci # safer to use ci instead on install
      - name: Build project
        run: npm run build
      - name: Deploy
        run: echo "Deploy to cloud"
  
