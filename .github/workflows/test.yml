name: Test Project
# on:
#   push:
#     branches:
#       - main
#   pull_request:
#     branches:
#       - main
on: push
jobs:
  test:
    runs-on: ubuntu-latest
  steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1
      #with the add configurations
    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '20.x'
    - name: Install dependencies
      run: npm ci # safer to use ci instead on install
    - name: Run tests
      rub: npm test

